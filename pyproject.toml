[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clapoff"
version = "0.1.0"
description = "Turn off your computer by clapping at it."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jesse Morgan" }]
keywords = ["clap", "shutdown", "audio", "microphone", "onset-detection", "laziness"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Utilities",
]
dependencies = ["numpy>=1.21", "sounddevice>=0.4"]

[project.optional-dependencies]
loopback = ["soundcard>=0.4"]
dev = ["pytest>=7", "soundcard>=0.4"]

[project.urls]
Homepage = "https://github.com/jeranaias/clapoff"
Issues = "https://github.com/jeranaias/clapoff/issues"

[project.scripts]
clapoff = "clapoff.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clapoff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
