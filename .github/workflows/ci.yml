name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install numpy and pytest
        # The detector is pure numpy, so the tests need no audio backend and no
        # microphone. CI has never heard a sound and never will.
        run: python -m pip install --upgrade pip numpy pytest
      - name: Run tests
        run: python -m pytest -q
