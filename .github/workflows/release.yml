name: Release

# Tag it and it ships:  git tag v0.1.0 && git push --tags
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write        # PyPI trusted publishing: no API token to leak

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  windows-exe:
    # The download for people who do not have Python and should not need it.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pyinstaller pillow numpy sounddevice soundcard pystray
      - run: python tools/make_icon.py
      - run: python tools/build_exe.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/clapoff.exe

  github-release:
    needs: [build, windows-exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # Requires a trusted publisher for jeranaias/clapoff configured on PyPI.
      # Until that exists this job is the only one that fails, and the GitHub
      # release still goes out.
      - uses: pypa/gh-action-pypi-publish@release/v1
